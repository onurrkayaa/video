[project]
name = "medya-studyo"
version = "0.1.0"
description = "Yerel medya stüdyosu: video, ses, görsel ve animasyon için yetenek katmanı (`medya` komutu)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pillow>=11.0",
]

[project.optional-dependencies]
# Ağır sağlayıcılar burada değil: her biri `uv tool` ile kendi yalıtılmış ortamına kurulur (bkz. yetenekler.toml).
analiz = ["scenedetect>=0.7.1"]   # scenedetect opencv-python getirir; headless ikinci kopya olur
# kurgu planını kurgu programlarına aktarma (medya nle): OTIO çekirdeği + CMX 3600 EDL uyarlayıcısı
# (otio-fcpx-xml-adapter bilerek YOK: erimeyi düşürdü, 29,97'de çöktü — sınandı)
nle = ["opentimelineio==0.18.1", "otio-cmx3600-adapter==1.0.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
medya = "medya.cli:ana"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medya"]

[tool.uv]
package = true

[tool.pytest.ini_options]
# geçici test dosyaları çalışma alanında (her koşuda temizlenir), sistemin geçici klasöründe birikmez
addopts = "-p no:cacheprovider --basetemp=testler/.gecici"
