boyut_mb = 80
not = "6.0: zscale, tonemap, vidstab, xfade, minterpolate, lut3d, nlmeans, loudnorm, perspective (medya ciz alt piksel yakınlaştırma), libvmaf, libx264/libx265, aac_at, videotoolbox var. Çıktı serbest (ticari evet). ffprobe ayrı paket (4.4.1); medya ciz kare zamanlarını ffmpeg 6.0'dan okur"

