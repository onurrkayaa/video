# Yetenek kayıt defteri — stüdyonun "hangi iş hangi araçla yapılır" tek kaynağı.
#
# Beceriler ve ajanlar ARACI değil YETENEĞİ çağırır (`medya <komut>`). Daha iyi bir araç çıktığında:
#   1) [[saglayici]] ekle (lisans, ticari kullanım, boyut, kurulum, kontrol komutu)
#   2) medya/komutlar/<modül>.py içine uyarlayıcı ekle
#   3) yeteneğin `saglayici` alanını değiştir (eskisi `yedek`e geçer), `medya test <yetenek>` ile sına.
# Ücretli/bulut sağlayıcılar `etkin = false` durur; kullanıcının açık onayı olmadan açılmaz.
#
# Alanlar: tur = ikili | python-arac (uv tool, yalıtılmış) | python-paket (.venv) | node | uygulama (GUI; kullanıcı kurar)
#          | bulut-ucretli
#          ticari = evet | hayir | kosullu | ?

