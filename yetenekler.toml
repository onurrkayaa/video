# ---------------------------------------------------------------- sağlayıcılar
[[saglayici]]
ad = "ffmpeg"
tur = "ikili"
lisans = "GPL-3.0-or-later (npm ffmpeg-static 5.3.0 = FFmpeg 6.0; --enable-gpl --enable-version3 --enable-nonfree derlemesi: yerelde kullanım serbest, ikili dağıtılamaz — arac/ ve node_modules/ depoda yok)"
ticari = "evet"
kurulum = "npm install -D ffmpeg-static && ln -sf ../node_modules/ffmpeg-static/ffmpeg arac/ffmpeg"
